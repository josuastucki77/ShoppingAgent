name: shopping-agent

x-honcho: &honcho
  image: shopping-agent-honcho:ca81eed3ddca
  build:
    context: ${HONCHO_SOURCE:-https://github.com/plastic-labs/honcho.git#ca81eed3ddca57d7407854c5f447195779dcabf2}
  restart: unless-stopped
  environment: &honcho-env
    DB_CONNECTION_URI: postgresql+psycopg://honcho:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env fehlt}@database:5432/honcho
    AUTH_USE_AUTH: "false"
    CACHE_ENABLED: "true"
    CACHE_URL: redis://redis:6379/0?suppress=true
    TELEMETRY_ENABLED: "false"
    SENTRY_ENABLED: "false"
    LLM_OPENAI_API_KEY: ${OLLAMA_API_KEY:-ollama}
    EMBEDDING_MODEL_CONFIG__TRANSPORT: openai
    EMBEDDING_MODEL_CONFIG__MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
    EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: &ollama-url ${OLLAMA_BASE_URL:-http://192.168.1.111:11434/v1}
    EMBEDDING_VECTOR_DIMENSIONS: ${OLLAMA_EMBEDDING_DIMENSIONS:-768}
    EMBEDDING_MAX_INPUT_TOKENS: "2048"
    EMBEDDING_MODEL_CONFIG__MAX_BATCH_SIZE: "8"
    DERIVER_MODEL_CONFIG__MODEL: &ollama-model ${OLLAMA_MODEL:-shopping-qwen3.5-9b:latest}
    DERIVER_MODEL_CONFIG__THINKING_EFFORT: "none"
    DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: *ollama-url
    DERIVER_WORKERS: "1"
    DERIVER_FLUSH_ENABLED: "true"
    SUMMARY_MODEL_CONFIG__MODEL: *ollama-model
    SUMMARY_MODEL_CONFIG__THINKING_EFFORT: "none"
    SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: *ollama-url
    DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL: *ollama-model
    DIALECTIC_LEVELS__minimal__MODEL_CONFIG__THINKING_EFFORT: "none"
    DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL: *ollama-url
    DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL: *ollama-model
    DIALECTIC_LEVELS__low__MODEL_CONFIG__THINKING_EFFORT: "none"
    DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL: *ollama-url
    DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL: *ollama-model
    DIALECTIC_LEVELS__medium__MODEL_CONFIG__THINKING_EFFORT: "none"
    DIALECTIC_LEVELS__medium__MODEL_CONFIG__OVERRIDES__BASE_URL: *ollama-url
    DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL: *ollama-model
    DIALECTIC_LEVELS__high__MODEL_CONFIG__THINKING_EFFORT: "none"
    DIALECTIC_LEVELS__high__MODEL_CONFIG__OVERRIDES__BASE_URL: *ollama-url
    DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL: *ollama-model
    DIALECTIC_LEVELS__max__MODEL_CONFIG__THINKING_EFFORT: "none"
    DIALECTIC_LEVELS__max__MODEL_CONFIG__OVERRIDES__BASE_URL: *ollama-url
    DREAM_DEDUCTION_MODEL_CONFIG__MODEL: *ollama-model
    DREAM_DEDUCTION_MODEL_CONFIG__THINKING_EFFORT: "none"
    DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: *ollama-url
    DREAM_INDUCTION_MODEL_CONFIG__MODEL: *ollama-model
    DREAM_INDUCTION_MODEL_CONFIG__THINKING_EFFORT: "none"
    DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: *ollama-url
    TZ: ${TZ:-Europe/Zurich}

x-hermes: &hermes
  image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.23.1}
  working_dir: /opt/data
  environment:
    HERMES_HOME: /opt/data
    OPENAI_API_KEY: ${OLLAMA_API_KEY:-ollama}
    OPENAI_BASE_URL: *ollama-url
    OLLAMA_BASE_URL: *ollama-url
    OLLAMA_MODEL: *ollama-model
    OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-65536}
    OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
    OLLAMA_EMBEDDING_DIMENSIONS: ${OLLAMA_EMBEDDING_DIMENSIONS:-768}
    OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
    HONCHO_BASE_URL: http://honcho:8000
    HONCHO_API_KEY: local
    SHOPPING_USER: ${SHOPPING_USER:-josua}
    SHOPPING_CRON: ${SHOPPING_CRON:-0 9 * * *}
    GALAXUS_MCP_URL: ${GALAXUS_MCP_URL:-https://mcp.galaxus.ch}
    TZ: ${TZ:-Europe/Zurich}
  volumes:
    - hermes-data:/opt/data
    - ./output:/opt/data/cron/output
    - ./scripts:/project/scripts:ro
    - ./prompts:/project/prompts:ro
    - ./SOUL.md:/project/SOUL.md:ro

services:
  database:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: honcho
      POSTGRES_DB: honcho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env fehlt}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U honcho -d honcho]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.2
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20

  honcho:
    <<: *honcho
    entrypoint: [sh, /project/start_honcho.sh]
    volumes:
      - ./scripts/start_honcho.sh:/project/start_honcho.sh:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30

  honcho-deriver:
    <<: *honcho
    entrypoint: [/app/.venv/bin/python, -m, src.deriver]
    depends_on:
      honcho:
        condition: service_healthy

  hermes-init:
    <<: *hermes
    profiles: [setup]
    restart: "no"
    command: [/opt/hermes/.venv/bin/python, /project/scripts/bootstrap.py]
    depends_on:
      honcho:
        condition: service_healthy

  hermes:
    <<: *hermes
    restart: unless-stopped
    command: [gateway, run]
    depends_on:
      honcho:
        condition: service_healthy
      honcho-deriver:
        condition: service_started

volumes:
  hermes-data:
  postgres-data:
  redis-data:
